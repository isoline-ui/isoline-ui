name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/react-native/**'
      - 'packages/native/**'
      - 'examples/showcase/**'
      - 'scripts/build-docs-preview.mjs'
      - 'scripts/check-component-coverage.mjs'
      - 'scripts/check-catalog-browser.mjs'
      - 'scripts/check-focus-browser.mjs'
      - 'scripts/check-overlay-password-browser.mjs'
      - 'scripts/generate-component-examples.mjs'
      - 'scripts/generate-api-reference.mjs'
      - 'scripts/check-adoption-browser.mjs'
      - 'scripts/check-browser.mjs'
      - 'scripts/check-docs*.mjs'
      - 'scripts/check-documentation-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/react-native/**'
      - 'packages/native/**'
      - 'examples/showcase/**'
      - 'scripts/build-docs-preview.mjs'
      - 'scripts/check-component-coverage.mjs'
      - 'scripts/check-catalog-browser.mjs'
      - 'scripts/check-focus-browser.mjs'
      - 'scripts/check-overlay-password-browser.mjs'
      - 'scripts/generate-component-examples.mjs'
      - 'scripts/generate-api-reference.mjs'
      - 'scripts/check-adoption-browser.mjs'
      - 'scripts/check-browser.mjs'
      - 'scripts/check-docs*.mjs'
      - 'scripts/check-documentation-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
      - run: npm run docs:build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run docs:check
      - run: node scripts/check-docs-export.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run docs:test
      - run: touch apps/docs/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
