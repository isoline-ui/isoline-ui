name: Publish prerelease
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit or ref to package
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: isoline-prerelease
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck --workspace isoline-showcase
      - run: npm run export:ios --workspace isoline-showcase
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_OFFLINE: 1
      - run: npm run export:android --workspace isoline-showcase
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_OFFLINE: 1
      - name: Pack both archives and publish the prerelease
        run: node scripts/publish-prerelease.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
